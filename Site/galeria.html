<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria · Pitagorome</title>
  <meta name="description" content="Capturas de tela do Pitagorome: o corredor, a diretoria, a criação de personagem e os desafios.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>
  <div data-cabecalho></div>

  <main>
    <section class="topo-pagina">
      <img class="pixel" src="assets/img/hero-escola.jpg" alt="" width="1920" height="1080">
      <div class="topo-pagina-sombra"></div>
      <div class="conteudo topo-pagina-texto">
        <p class="chapeu">Galeria</p>
        <h1>A escola, quadro a quadro</h1>
        <p>Veja a Escola Pitagorome em pixel art, direto do jogo. Clique em uma imagem para ampliar.</p>
      </div>
      <div class="faixa-grama piso" style="background-image:url(assets/tiles/grama.png)"></div>
    </section>

    <section class="secao conteudo">
      <div class="galeria surgir em-sequencia" id="galeria"></div>
    </section>

    <div class="ampliada" id="ampliada" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
      <button type="button" class="botao botao-creme botao-icone fechar" aria-label="Fechar">✕</button>
      <button type="button" class="botao botao-creme botao-icone anterior" aria-label="Imagem anterior">‹</button>
      <div><img class="pixel" src="" alt=""><p></p></div>
      <button type="button" class="botao botao-creme botao-icone proxima" aria-label="Próxima imagem">›</button>
    </div>
  </main>

  <div data-rodape></div>
  <script src="js/dados.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
